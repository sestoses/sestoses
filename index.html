<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sestoses v3.0 - Operasyon Paneli</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-top: 0; color: #4CAF50; font-size: 22px; }
        .section {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: left;
        }
        .section label { font-size: 13px; color: #aaa; display: block; margin-bottom: 5px; }
        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: #3a3a3a;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }
        /* PTT Telsiz Butonu */
        #pttButton {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(0, 123, 255, 0.4);
            transition: 0.2s;
            margin: 10px auto;
            display: block;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
        }
        #pttButton:active, #pttButton.active {
            background-color: #28a745;
            box-shadow: 0 0 0 6px rgba(40, 167, 69, 0.4), 0 6px 15px rgba(40, 167, 69, 0.4);
            transform: scale(0.95);
        }
        /* Acil Durum / SOS Butonu */
        #sosButton {
            width: 100%;
            padding: 12px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(220, 53, 69, 0.4);
            margin-top: 5px;
        }
        #sosButton:active { background-color: #bd2130; }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #ccc;
            background: #181818;
            padding: 8px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sestoses v3.0</h2>

        <!-- Durak Yönetim Sistemi -->
        <div class="section">
            <label for="stopSelect">Aktif Durak Seçimi:</label>
            <select id="stopSelect">
                <option value="Durak 1: Merkez Terminal">Durak 1: Merkez Terminal</option>
                <option value="Durak 2: Hastane Kavşağı">Durak 2: Hastane Kavşağı</option>
                <option value="Durak 3: Üniversite Kampüs">Durak 3: Üniversite Kampüs</option>
                <option value="Durak 4: Sanayi Sitesi">Durak 4: Sanayi Sitesi</option>
            </select>
        </div>

        <!-- Navigasyon Bilgisi -->
        <div class="section">
            <label>Navigasyon Durumu:</label>
            <div id="navStatus" style="font-size: 14px; color: #4CAF50; font-weight: bold;">Rota Aktif: Hedefe yönlendiriliyor...</div>
        </div>

        <!-- Bas & Konuş Telsiz Alanı -->
        <div class="section" style="text-align: center;">
            <label>Telsiz Haberleşme</label>
            <button id="pttButton">KONUŞMAK İÇİN BAS</button>
        </div>

        <!-- Acil Durum / SOS Paneli -->
        <div class="section" style="border: 1px solid #dc3545;">
            <label style="color: #ff6b6b;">Acil Durum Protokolü</label>
            <button id="sosButton">🚨 ACİL DURUM (SOS)</button>
        </div>

        <div id="status">Bağlantı bekleniyor...</div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const pttButton = document.getElementById('pttButton');
        const sosButton = document.getElementById('sosButton');
        const stopSelect = document.getElementById('stopSelect');

        // WebSocket Bağlantısı (Dinamik wss:// / ws:// tespiti)
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        let mediaRecorder;

        ws.onopen = () => {
            statusDiv.innerText = 'Bağlantı kuruldu. Sistem aktif.';
            statusDiv.style.color = '#4CAF50';
        };

        ws.onclose = () => {
            statusDiv.innerText = 'Bağlantı koptu. Yeniden bağlanılıyor...';
            statusDiv.style.color = '#dc3545';
        };

        // Gelen ses veya uyarı mesajları
        ws.onmessage = async (event) => {
            if (typeof event.data === 'string') {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'SOS') {
                        alert(`🚨 ACİL DURUM UYARISI: ${data.message}`);
                    }
                } catch (e) {
                    console.log("Mesaj:", event.data);
                }
            } else {
                // Ses verisi oynatma
                const audioBlob = new Blob([event.data], { type: 'audio/webm' });
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);
                audio.play().catch(e => console.log('Ses çalma hatası:', e));
            }
        };

        // Durak değiştiğinde sunucuya bildir
        stopSelect.addEventListener('change', () => {
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'STOP_UPDATE', stop: stopSelect.value }));
                statusDiv.innerText = `Durak güncellendi: ${stopSelect.value}`;
            }
        });

        // Acil Durum SOS Butonu
        sosButton.addEventListener('click', () => {
            if (confirm("Acil durum sinyali göndermek istediğinize emin misiniz?")) {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'SOS', message: `${stopSelect.value} konumundan acil yardım çağrısı!` }));
                    alert("SOS Sinyali Gönderildi!");
                } else {
                    alert("Sunucu bağlantısı yok!");
                }
            }
        });

        // Mikrofon ve PTT Ses Kaydı
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0 && ws.readyState === WebSocket.OPEN) {
                        ws.send(event.data);
                    }
                };

                const startRecording = () => {
                    if (mediaRecorder && mediaRecorder.state === 'inactive') {
                        mediaRecorder.start(200);
                        pttButton.classList.add('active');
                        statusDiv.innerText = 'Konuşuluyor...';
                    }
                };

                const stopRecording = () => {
                    if (mediaRecorder && mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                        pttButton.classList.remove('active');
                        statusDiv.innerText = 'Dinleniyor...';
                    }
                };

                // Mouse olayları
                pttButton.addEventListener('mousedown', startRecording);
                pttButton.addEventListener('mouseup', stopRecording);

                // Dokunmatik (Mobil) olayları
                pttButton.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    startRecording();
                });
                pttButton.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    stopRecording();
                });
            })
            .catch(err => {
                statusDiv.innerText = 'Mikrofon izni reddedildi!';
                console.error(err);
            });
    </script>
</body>
</html>
