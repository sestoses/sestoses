<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bas & Konuş (PTT)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #pttButton {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: none;
            background-color: #ff4d4d;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(255, 77, 77, 0.4);
            transition: 0.2s;
            outline: none;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Basılı tutulduğunda yeşil renk ve yeşil çerçeve/gölge efekti */
        #pttButton:active, #pttButton.active {
            background-color: #28a745;
            box-shadow: 0 0 0 6px rgba(40, 167, 69, 0.4), 0 6px 15px rgba(40, 167, 69, 0.4);
            transform: scale(0.95);
        }
        #status {
            margin-top: 20px;
            font-size: 16px;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Bas & Konuş Telsiz</h2>
        <button id="pttButton">KONUŞMAK İÇİN BAS</button>
        <div id="status">Bağlantı bekleniyor...</div>
    </div>

    <script>
        const statusDiv = document.getElementById('status');
        const pttButton = document.getElementById('pttButton');

        // WebSocket bağlantısı (Sunucu adresi otomatik algılanır)
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${window.location.host}`);

        let mediaRecorder;
        let audioChunks = [];

        ws.onopen = () => {
            statusDiv.innerText = 'Bağlantı kuruldu. Konuşabilirsiniz.';
        };

        ws.onclose = () => {
            statusDiv.innerText = 'Bağlantı koptu. Yeniden bağlanılıyor...';
        };

        // Gelen ses verisini oynatma
        ws.onmessage = async (event) => {
            const audioBlob = new Blob([event.data], { type: 'audio/webm' });
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            audio.play().catch(e => console.log('Ses çalma hatası:', e));
        };

        // Mikrofon izni ve kaydı hazırlama
        navigator.mediaDevices.getUserMedia({ audio: true })
            .then(stream => {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0 && ws.readyState === WebSocket.OPEN) {
                        ws.send(event.data);
                    }
                };

                // Bas-konuş olayları (Mouse ve Dokunmatik desteği)
                const startRecording = () => {
                    if (mediaRecorder && mediaRecorder.state === 'inactive') {
                        audioChunks = [];
                        mediaRecorder.start(200); // 200ms'lik paketler halinde gecikmesiz gönderim
                        pttButton.classList.add('active');
                        statusDiv.innerText = 'Konuşuluyor...';
                    }
                };

                const stopRecording = () => {
                    if (mediaRecorder && mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                        pttButton.classList.remove('active');
                        statusDiv.innerText = 'Dinleniyor...';
                    }
                };

                // Bilgisayar için mouse olayları
                pttButton.addEventListener('mousedown', startRecording);
                pttButton.addEventListener('mouseup', stopRecording);

                // Telefonlar için dokunmatik olayları
                pttButton.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    startRecording();
                });
                pttButton.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    stopRecording();
                });
            })
            .catch(err => {
                statusDiv.innerText = 'Mikrofon izni reddedildi veya hata oluştu!';
                console.error(err);
            });
    </script>
</body>
</html>
